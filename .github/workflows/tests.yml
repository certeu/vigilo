name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Web API + white-box engine. tests/greybox is excluded: it swaps the
      # temporalio modules for mocks at import time, which makes the white-box
      # Temporal workflow tests hang when both run in one pytest process.
      # --timeout turns any future hang into a failure instead of a stuck job.
      - name: Run pytest
        run: >-
          uv run --frozen --all-extras --python 3.12
          --with pytest --with pytest-asyncio --with pytest-timeout
          pytest tests --ignore=tests/greybox --timeout=300 --durations=15

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
