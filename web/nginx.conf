# Serves the built SPA (history-API fallback) AND proxies /api to the API service,
# so the UI works standalone (direct port) as well as behind Traefik.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2100m;   # allow large source uploads (see VIGILO_MAX_UPLOAD_MB)

    # API proxy: /api/<x> -> http://api:8080/<x> (trailing slash strips the prefix).
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;            # stream SSE run logs without buffering
        proxy_read_timeout 3600s;
    }

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: everything else serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
