# Serves the built SPA (history-API fallback) AND proxies /api to the API service,
# so the UI works standalone (direct port) as well as behind Traefik.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2100m;   # allow large source uploads (see VIGILO_MAX_UPLOAD_MB)

    # Real client address. By default nginx trusts nobody: $remote_addr is the TCP peer.
    # Behind a TLS proxy (Traefik in docker-compose.full.yml) this file declares that
    # proxy with set_real_ip_from + real_ip_header, so $remote_addr becomes the real
    # client. The default image ships an empty file.
    include /etc/nginx/vigilo-realip.conf;

    # Security headers for the SPA. add_header is NOT inherited into a location that has
    # its own add_header, so the full set is repeated in each location below.
    # CSP matches the Vite build: one external module script and stylesheet (no inline
    # scripts), React/React Flow set inline style="" attributes ('unsafe-inline' for
    # styles only), self-hosted fonts (bundled woff2), same-origin API.
    # (HSTS is sent by the TLS proxy, not here: this server may be plain HTTP.)

    # API proxy: /api/<x> -> http://api:8080/<x> (trailing slash strips the prefix).
    # Only the PUBLIC listener (:8080) is proxied. The API's internal listener (:8081,
    # per-run secret redemption for workers) must never be proxied here or routed by
    # Traefik: workers reach it directly over the internal Docker network.
    location /api/ {
        # Resolve "api" at request time through Docker's embedded DNS (re-checked every
        # 10 s) instead of once at nginx start: a recreated api container gets a new IP,
        # and a startup-resolved address would keep answering 502 until the UI was
        # restarted too. A variable in proxy_pass enables runtime resolution; it also
        # disables the automatic prefix replacement, so the rewrite strips /api.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $vigilo_api http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $vigilo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # OVERWRITE (never append) so a client-sent X-Forwarded-For cannot reach the API;
        # the API trusts only this hop (VIGILO_TRUSTED_PROXIES).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;            # stream SSE run logs without buffering
        proxy_read_timeout 3600s;
    }

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # SPA fallback: everything else serves index.html. Never cache it: it names the
    # hashed bundles, so a cached copy keeps browsers on the previous release after
    # a deploy. (The hashed assets above are safe to cache for a year.)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
