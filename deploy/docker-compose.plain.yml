# Plain-HTTP override — run the full platform WITHOUT Traefik and WITHOUT TLS.
#
# Layer it on top of the full stack:
#   docker compose --env-file .env \
#     -f deploy/docker-compose.full.yml -f deploy/docker-compose.plain.yml \
#     up --build -d
#   → UI at  http://<host>:${VIGILO_HTTP_PORT:-8080}
#
# It does two things: it stops Traefik from starting (replicas: 0) and publishes the
# UI's nginx on a host port. The UI serves the app and proxies /api to the API over the
# internal network, exactly as it does behind Traefik, so nothing else changes.
#
# Use it when:
#   • you are trying Vigilo out locally and don't have a public hostname, or
#   • you already run your own reverse proxy / load balancer and want to terminate TLS
#     there. Point it at this port and set VIGILO_UI_BASE_URL to the public URL,
#     otherwise invitation and report emails will link to the wrong address.
#
# WARNING: traffic on this port is unencrypted, including logins. Do not expose it to an
# untrusted network. To reach it only from this machine (the usual setup when your own
# proxy runs on the same host), bind it to loopback:  VIGILO_HTTP_PORT=127.0.0.1:8080
#
# See "Deployment options" in the README.

services:
  traefik:
    deploy:
      replicas: 0                # not started; TLS is someone else's job here

  ui:
    ports:
      - "${VIGILO_HTTP_PORT:-8080}:80"
