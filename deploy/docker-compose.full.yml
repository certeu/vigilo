# Full platform — everything needed to run REAL scans through the API/UI:
#   Traefik (TLS reverse proxy) + Postgres + API + UI + MailHog + Temporal + Worker.
#
# A job created in the UI/API starts the WhiteboxEngineWorkflow on Temporal;
# the persistent worker (built from the root Dockerfile) runs it against the repo on a
# shared volume and writes the real report + logs there.
#
# ── Network exposure (hardened) ─────────────────────────────────────────────
# ONLY Traefik publishes host ports (80 → redirect to 443, 443 → TLS). Everything
# else is reachable only on the internal `vigilo_net` Docker network:
#   • UI      — the sole public router (Host rule + TLS via the `orgca` resolver).
#   • API     — NO router, NO published port. Reached only by the UI's nginx, which
#               proxies /api → api:8080 internally (see web/nginx.conf).
#   • Postgres / Temporal / MailHog — no router, no published port. Internal only.
#
# ── Certificates ────────────────────────────────────────────────────────────
# TLS certificates are issued over ACME (HTTP-01 challenge on :80) and stored in
# the `acme_data` volume, so they are NOT re-requested on every restart.
#
# The default CA is Let's Encrypt, which works for any host with a public DNS
# name. Set ACME_CASERVER in .env to use a different CA (for example an internal
# or corporate ACME server).
#
# Two requirements before first boot:
#   • ACME_EMAIL must be a REAL address — Let's Encrypt rejects @example.com.
#   • The CA must be able to reach this host on port 80 at ${VIGILO_HOSTNAME},
#     so DNS must resolve and the firewall must allow it.
#
# Running without TLS, or behind your own reverse proxy? See "Deployment
# options" in the README — you do not have to use Traefik.
#
# ── Usage ───────────────────────────────────────────────────────────────────
#   Set in .env (or the shell):
#     VIGILO_HOSTNAME=vigilo.example.com    # public UI hostname (default shown)
#     VIGILO_JWT_SECRET=...  VIGILO_FERNET_KEY=...  POSTGRES_PASSWORD=...
#     VIGILO_FIRST_ADMIN_EMAIL=admin@example.com  VIGILO_FIRST_ADMIN_PASSWORD=...
#     # optional overrides: ACME_EMAIL, ACME_CASERVER
#   docker compose --env-file .env -f deploy/docker-compose.full.yml up --build -d
#   → UI at  https://${VIGILO_HOSTNAME}   (http:// redirects to https://)
#   Model credentials for the worker come from the repo-root .env (env_file below).
#
# ── Grey-box web platform (optional) ────────────────────────────────────────
#   Off by default. To enable it set VIGILO_GREYBOX_WEB_ENABLED=true in .env and add the
#   `greybox` profile so the executor process (service `greybox-worker`) is started:
#     docker compose --env-file .env --profile greybox -f deploy/docker-compose.full.yml up --build -d
#     docker compose ... --profile greybox up -d --scale greybox-worker=3   # more capacity
#   The default executor mode is a separate process (VIGILO_GREYBOX_EXECUTOR=worker);
#   `inprocess` runs it inside the API (development only). Details and every
#   VIGILO_GREYBOX_* setting: deploy/config-reference.md.

services:
  traefik:
    image: traefik:v3.7.8
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=*
      - no_proxy=*
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect all plain HTTP to HTTPS (the ACME HTTP-01 challenge on :80 is
      # served before the redirect, so certificate issuance still works).
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # ACME issuance — defaults to Let's Encrypt. Point ACME_CASERVER at your
      # own CA to use an internal/corporate ACME server instead.
      - "--certificatesresolvers.orgca.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.orgca.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.orgca.acme.caserver=${ACME_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}"
      - "--certificatesresolvers.orgca.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.orgca.acme.keytype=EC256"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme_data:/acme
    restart: unless-stopped
    networks: [vigilo_net]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vigilo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD - see header}
      POSTGRES_DB: vigilo
    volumes:
      - vigilo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [vigilo_net]           # internal only — no published port

  mailhog:
    image: mailhog/mailhog:latest
    # Dev mail catcher — internal only, NO published port. To read caught mail,
    # port-forward temporarily: `docker compose port mailhog 8025` / an SSH tunnel.
    # In production, point the API at a real relay (VIGILO_SMTP_* in .env) instead.
    restart: unless-stopped
    networks: [vigilo_net]

  temporal:
    image: temporalio/temporal:1.5.0
    command: ["server", "start-dev", "--db-filename", "/home/temporal/temporal.db", "--ip", "0.0.0.0"]
    environment:
      # On proxied VMs Temporal's internal client dials itself; a daemon-injected
      # proxy breaks it. Wipe proxy vars inside the container.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=*
      - no_proxy=*
    volumes:
      - temporal_data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [vigilo_net]           # internal only — no published port

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    image: vigilo-worker:latest
    env_file:
      - path: ../.env
        required: false
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      # Where the worker redeems per-run secrets (GitLab token for patch delivery,
      # cookie header for authenticated testing) just in time. Internal listener of the
      # API: not published, not proxied by the UI.
      - VIGILO_INTERNAL_API_URL=${VIGILO_INTERNAL_API_URL:-http://api:8081}
      - NO_PROXY=${NO_PROXY:-temporal,localhost,127.0.0.1,0.0.0.0,postgres,api}
      - no_proxy=${NO_PROXY:-temporal,localhost,127.0.0.1,0.0.0.0,postgres,api}
      # The worker shares the repo-root .env with the API (for the model credentials),
      # but runs AI agents that may be prompt-injected: it must NOT receive the
      # platform's secrets. Blank them here (an environment entry overrides env_file).
      # The worker never touches the database, the vault, logins or e-mail: it redeems
      # per-run secrets over the API's internal listener instead.
      - VIGILO_FERNET_KEY=
      - VIGILO_JWT_SECRET=
      - VIGILO_DATABASE_URL=
      - POSTGRES_PASSWORD=
      - VIGILO_SMTP_USER=
      - VIGILO_SMTP_PASSWORD=
      - VIGILO_FIRST_ADMIN_EMAIL=
      - VIGILO_FIRST_ADMIN_PASSWORD=
    shm_size: 2gb
    volumes:
      - vigilo_jobs:/data/jobs
    depends_on:
      temporal:
        condition: service_healthy
    # Persistent worker: host the pipeline on the shared task queue (no self-start).
    command: ["python3", "-m", "src.temporal.worker", "--serve", "--task-queue", "vigilo-pipeline"]
    restart: unless-stopped
    networks: [vigilo_net]           # internal only — no published port

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: vigilo-api:latest         # shared with greybox-worker (one build)
    env_file:
      - path: ../.env
        required: false
    environment:
      VIGILO_DATABASE_URL: postgresql+asyncpg://vigilo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD - see header}@postgres:5432/vigilo
      VIGILO_JWT_SECRET: ${VIGILO_JWT_SECRET:?set a strong secret}
      VIGILO_FERNET_KEY: ${VIGILO_FERNET_KEY:?generate one - see header}
      VIGILO_FIRST_ADMIN_EMAIL: ${VIGILO_FIRST_ADMIN_EMAIL:-}
      VIGILO_FIRST_ADMIN_PASSWORD: ${VIGILO_FIRST_ADMIN_PASSWORD:-}
      # Public base URL used in invite + run-complete email links.
      VIGILO_UI_BASE_URL: ${VIGILO_UI_BASE_URL:-https://${VIGILO_HOSTNAME:-vigilo.example.com}}
      VIGILO_EXECUTION_ENGINE: ${VIGILO_EXECUTION_ENGINE:-temporal}
      VIGILO_TEMPORAL_ADDRESS: temporal:7233
      VIGILO_TEMPORAL_TASK_QUEUE: vigilo-pipeline
      VIGILO_JOBS_DATA_DIR: /data/jobs
      VIGILO_UPLOADS_DIR: /data/uploads
      # Internal secret-redemption listener (separate from the public :8080). Never
      # published and never proxied. VIGILO_INTERNAL_API_URL is what per-run worker
      # containers (docker engine) are told to call.
      VIGILO_INTERNAL_PORT: 8081
      VIGILO_INTERNAL_API_URL: ${VIGILO_INTERNAL_API_URL:-http://api:8081}
      # Email: defaults target the bundled MailHog (catches all mail, no auth).
      # For a real relay set HOST/PORT and, if needed, USER/PASSWORD/STARTTLS.
      VIGILO_SMTP_HOST: ${VIGILO_SMTP_HOST:-mailhog}
      VIGILO_SMTP_PORT: ${VIGILO_SMTP_PORT:-1025}
      VIGILO_SMTP_FROM: ${VIGILO_SMTP_FROM:-vigilo@example.com}
      VIGILO_SMTP_USER: ${VIGILO_SMTP_USER:-}
      VIGILO_SMTP_PASSWORD: ${VIGILO_SMTP_PASSWORD:-}
      VIGILO_SMTP_STARTTLS: ${VIGILO_SMTP_STARTTLS:-false}
      # Proxies whose X-Forwarded-For the API believes: the UI's nginx (vigilo_net).
      # Keep it to the hop(s) you control: the login throttle keys on this address.
      VIGILO_TRUSTED_PROXIES: ${VIGILO_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      VIGILO_GLOBAL_CONCURRENT_RUN_CAP: ${VIGILO_GLOBAL_CONCURRENT_RUN_CAP:-2}
      # Grey-box web platform (off by default). To enable: VIGILO_GREYBOX_WEB_ENABLED=true
      # in .env AND start the executor with `--profile greybox` (service greybox-worker).
      # The settings below are also read by that service; keep them identical.
      VIGILO_GREYBOX_WEB_ENABLED: ${VIGILO_GREYBOX_WEB_ENABLED:-false}
      VIGILO_GREYBOX_EXECUTOR: ${VIGILO_GREYBOX_EXECUTOR:-worker}
      VIGILO_GREYBOX_ALLOW_PRIVATE_TARGETS: ${VIGILO_GREYBOX_ALLOW_PRIVATE_TARGETS:-false}
      VIGILO_GREYBOX_BLOCKED_HOSTS: ${VIGILO_GREYBOX_BLOCKED_HOSTS:-}
      VIGILO_GREYBOX_BLOCKED_ENDPOINTS: ${VIGILO_GREYBOX_BLOCKED_ENDPOINTS:-}
      VIGILO_GREYBOX_MAX_ACTIVE_RUNS_PER_USER: ${VIGILO_GREYBOX_MAX_ACTIVE_RUNS_PER_USER:-2}
      VIGILO_GREYBOX_WORKER_MAX_RUNS: ${VIGILO_GREYBOX_WORKER_MAX_RUNS:-2}
      VIGILO_GREYBOX_LEASE_TTL_S: ${VIGILO_GREYBOX_LEASE_TTL_S:-60}
      VIGILO_GREYBOX_HEARTBEAT_S: ${VIGILO_GREYBOX_HEARTBEAT_S:-10}
      VIGILO_API_HOST: ${VIGILO_API_HOST:-0.0.0.0}
      VIGILO_API_PORT: ${VIGILO_API_PORT:-8080}
      # temporal engine reaches Temporal by service name; keep it off the proxy
      NO_PROXY: temporal,localhost,127.0.0.1,postgres,mailhog,api
    volumes:
      - vigilo_jobs:/data/jobs
      - vigilo_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped
    # NO published port and NO Traefik router: the API is reached only by the UI's
    # internal nginx /api proxy over vigilo_net. It is not accessible from outside.
    # A second listener (:8081, internal secret redemption for workers) is NOT
    # proxied by nginx and has no router either.
    networks: [vigilo_net]

  # Grey-box web platform executor (opt-in: `--profile greybox`, together with
  # VIGILO_GREYBOX_WEB_ENABLED=true on the API). The API only QUEUES grey-box runs when
  # VIGILO_GREYBOX_EXECUTOR=worker (the default); this process claims and executes them.
  # Without it, runs sit in `queued` until the reaper fails them.
  #   • Same image, database and settings as the API: it reads/writes the grey-box
  #     tables and decrypts the target's cookie credential with the Fernet key.
  #   • No published port, no router. It needs egress to the targets, Postgres and the
  #     model endpoint: the exploration agent calls the LLM API directly from this
  #     process, so it loads the repo-root .env for the model credentials (CODEX_*,
  #     ANTHROPIC_*, LITELLM_*, VIGILO_EXECUTOR) like the white-box worker. Platform
  #     secrets it never needs (JWT secret, admin login, SMTP credentials) are blanked
  #     below; it has no Temporal or SMTP access.
  #   • Scale with `docker compose ... up -d --scale greybox-worker=N`: claims are
  #     conditional UPDATEs and a partial unique index allows one active run per target.
  # The scope guard (VIGILO_GREYBOX_*, VIGILO_API_PORT/HOST, VIGILO_INTERNAL_*) is read
  # from the SAME environment as the API: keep the two services' values identical.
  greybox-worker:
    profiles: ["greybox"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: vigilo-api:latest
    env_file:
      # the model backend credentials (ANTHROPIC_* / CODEX_* / LITELLM_*): the API
      # resolves a run's model at start, the worker calls it
      - path: ../.env
        required: false
    environment:
      VIGILO_DATABASE_URL: postgresql+asyncpg://vigilo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD - see header}@postgres:5432/vigilo
      VIGILO_FERNET_KEY: ${VIGILO_FERNET_KEY:?generate one - see header}
      # Platform secrets this process never needs: blank them (it runs an AI agent).
      VIGILO_JWT_SECRET: ""
      POSTGRES_PASSWORD: ""
      VIGILO_SMTP_USER: ""
      VIGILO_SMTP_PASSWORD: ""
      VIGILO_FIRST_ADMIN_EMAIL: ""
      VIGILO_FIRST_ADMIN_PASSWORD: ""
      VIGILO_RUN_MIGRATIONS_ON_START: "false"     # the API owns migrations
      VIGILO_GREYBOX_WEB_ENABLED: ${VIGILO_GREYBOX_WEB_ENABLED:-true}
      VIGILO_GREYBOX_EXECUTOR: worker
      VIGILO_GREYBOX_ALLOW_PRIVATE_TARGETS: ${VIGILO_GREYBOX_ALLOW_PRIVATE_TARGETS:-false}
      VIGILO_GREYBOX_BLOCKED_HOSTS: ${VIGILO_GREYBOX_BLOCKED_HOSTS:-}
      VIGILO_GREYBOX_BLOCKED_ENDPOINTS: ${VIGILO_GREYBOX_BLOCKED_ENDPOINTS:-}
      VIGILO_GREYBOX_WORKER_MAX_RUNS: ${VIGILO_GREYBOX_WORKER_MAX_RUNS:-2}
      VIGILO_GREYBOX_SANDBOX_ISOLATION: ${VIGILO_GREYBOX_SANDBOX_ISOLATION:-auto}
      VIGILO_GREYBOX_LEASE_TTL_S: ${VIGILO_GREYBOX_LEASE_TTL_S:-60}
      VIGILO_GREYBOX_HEARTBEAT_S: ${VIGILO_GREYBOX_HEARTBEAT_S:-10}
      # Platform endpoints the scope guard must refuse as targets (must match the API).
      VIGILO_API_HOST: ${VIGILO_API_HOST:-0.0.0.0}
      VIGILO_API_PORT: ${VIGILO_API_PORT:-8080}
      VIGILO_INTERNAL_PORT: 8081
      VIGILO_INTERNAL_API_URL: ${VIGILO_INTERNAL_API_URL:-http://api:8081}
      # Keep the internal hostnames off any corporate proxy; targets still use it if set.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,api}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,postgres,api}
    command: ["python", "-m", "src.greybox_web.worker"]
    # Enable generated-tool namespaces only on this isolated worker. The worker
    # drops every capability except those used to launch bubblewrap as nobody.
    security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started        # migrations run at API boot
    restart: unless-stopped
    networks: [vigilo_net]           # internal only — no published port

  ui:
    build:
      context: ../web
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped
    networks: [vigilo_net]
    volumes:
      # Trust Traefik for the real client address (replaced by an empty file in
      # docker-compose.plain.yml, where nothing is in front of nginx).
      - ./nginx-realip-traefik.conf:/etc/nginx/vigilo-realip.conf:ro
    # The ONLY public router: UI over HTTPS. nginx (inside this image) serves the
    # SPA and proxies /api → api:8080 internally, so the API needs no router.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=vigilo_net"
      - "traefik.http.routers.vigilo-ui.rule=Host(`${VIGILO_HOSTNAME:-vigilo.example.com}`)"
      - "traefik.http.routers.vigilo-ui.entrypoints=websecure"
      - "traefik.http.routers.vigilo-ui.tls=true"
      - "traefik.http.routers.vigilo-ui.tls.certresolver=orgca"
      - "traefik.http.routers.vigilo-ui.middlewares=vigilo-sec"
      - "traefik.http.services.vigilo-ui.loadbalancer.server.port=80"
      # Curated security headers (HTTPS-only stack):
      #   HSTS (2y, subdomains, preload) · no MIME sniffing · deny framing ·
      #   trimmed referrer. X-XSS-Protection is intentionally omitted (deprecated).
      - "traefik.http.middlewares.vigilo-sec.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.vigilo-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.vigilo-sec.headers.stsPreload=true"
      - "traefik.http.middlewares.vigilo-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.vigilo-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.vigilo-sec.headers.referrerPolicy=strict-origin-when-cross-origin"

volumes:
  vigilo_pg:
  vigilo_jobs:
  vigilo_uploads:
  temporal_data:
  acme_data:

networks:
  vigilo_net:
    name: vigilo_net
