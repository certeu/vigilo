networks:
  lab-net:
    name: vigilo-net
    driver: bridge

services:
  temporal:
    image: temporalio/temporal:latest
    container_name: vigilo-temporal-greybox
    command: ["server", "start-dev", "--db-filename", "/home/temporal/temporal.db", "--ip", "0.0.0.0"]
    ports:
      - "127.0.0.1:7233:7233"   # gRPC
      - "127.0.0.1:8233:8233"   # Web UI (built-in)
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - lab-net

  surrealdb:
    image: surrealdb/surrealdb:v2
    container_name: vigilo-surrealdb
    user: "0:0"   # named volume /data is root-owned; upstream image default user cannot write to it
    command: ["start", "--user", "root", "--pass", "${SURREALDB_PASS:-changeme}", "--log", "info", "surrealkv:/data/vigilo.db"]
    ports:
      - "${SURREALDB_HOST_PORT:-8010}:8000"   # SurrealDB API — accessible from host (override with SURREALDB_HOST_PORT)
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - lab-net

  surrealist:
    image: surrealdb/surrealist:latest
    container_name: vigilo-surrealist
    ports:
      - "8800:8080"   # Surrealist UI — http://localhost:8800 (container nginx listens on 8080)
    depends_on:
      surrealdb:
        condition: service_healthy
    networks:
      - lab-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.greybox
    container_name: vigilo-greybox-worker
    depends_on:
      temporal:
        condition: service_healthy
      surrealdb:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TEMPORAL_ADDRESS=temporal:7233
      - SURREALDB_URL=${SURREALDB_URL:-ws://surrealdb:8000}
      - SURREALDB_USER=${SURREALDB_USER:-root}
      - SURREALDB_PASS=${SURREALDB_PASS:-changeme}
      - GREYBOX_MODE=true
      - ANTHROPIC_SMALL_MODEL=${ANTHROPIC_SMALL_MODEL:-}
      - ANTHROPIC_MEDIUM_MODEL=${ANTHROPIC_MEDIUM_MODEL:-}
      - ANTHROPIC_LARGE_MODEL=${ANTHROPIC_LARGE_MODEL:-}
      - GREYBOX_MAX_CONCURRENT_AGENTS=${GREYBOX_MAX_CONCURRENT_AGENTS:-12}
      - GREYBOX_PER_SCAN_COST_CEILING=${GREYBOX_PER_SCAN_COST_CEILING:-50.00}
      # Azure Foundry
      - CLAUDE_CODE_USE_FOUNDRY=${CLAUDE_CODE_USE_FOUNDRY:-}
      - ANTHROPIC_FOUNDRY_RESOURCE=${ANTHROPIC_FOUNDRY_RESOURCE:-}
      - ANTHROPIC_FOUNDRY_API_KEY=${ANTHROPIC_FOUNDRY_API_KEY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - no_proxy=surrealdb,temporal,localhost,127.0.0.1,${NO_PROXY:-}
      - NO_PROXY=surrealdb,temporal,localhost,127.0.0.1,${NO_PROXY:-}
    volumes:
      - ${CREDS_FILE:-./configs}:/app/configs:ro
      - ${OUTPUT_DIR:-.vigilo}:/app/.vigilo
    shm_size: 2gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lab-net

volumes:
  temporal-data:
  surrealdb-data:
