[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigilo"
version = "2.0.0"
description = "Vigilo — AI Pentest Pipeline"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.9.0",
    "pydantic>=2.0",
    "aiofiles>=24.1",
    "pyyaml>=6.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
greybox = [
    "surrealdb>=1.0.0",
    "httpx>=0.27.0",
]
webapi = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "fastapi-users[sqlalchemy]>=14.0",
    "pydantic-settings>=2.2",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "croniter>=2.0",
]
webapi-test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "httpx>=0.28.1",
]

[project.scripts]
save-deliverable = "scripts.save_deliverable:main"
graph-tool = "scripts.graph_tool:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
